services:
  db:
    image: postgres:16-alpine
    container_name: sbdcs_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: sbdcs
      POSTGRES_USER: sbdcs_user
      POSTGRES_PASSWORD: sbdcs_local_pass
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sbdcs_user -d sbdcs"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sbdcs_backend_dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sbdcs_user:sbdcs_local_pass@db:5432/sbdcs
      JWT_SECRET: sbdcs-dev-secret
      EMAIL_MODE: mock
    volumes:
      - ./backend:/app/backend
      - ./uploads:/app/uploads
    ports:
      - "8000:8000"
    command: python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    image: node:22-alpine
    container_name: sbdcs_frontend_dev
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    depends_on:
      - backend

volumes:
  postgres_data_dev: