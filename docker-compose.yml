services:
  db:
    image: postgres:16-alpine
    container_name: sbdcs_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sbdcs
      POSTGRES_USER: sbdcs_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sbdcs_local_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sbdcs_user -d sbdcs"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sbdcs_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sbdcs_user:${POSTGRES_PASSWORD:-sbdcs_local_pass}@db:5432/sbdcs
      JWT_SECRET: ${JWT_SECRET:-sbdcs-local-secret-change-me}
      EMAIL_MODE: ${EMAIL_MODE:-mock}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
    volumes:
      - ./uploads:/app/uploads
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sbdcs_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data: